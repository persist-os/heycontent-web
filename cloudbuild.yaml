steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/heycontent-web:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/heycontent-web:latest', '.' ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/heycontent-web:$COMMIT_SHA' ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/heycontent-web:latest' ]

  # Deploy container to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'heycontent-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/heycontent-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/heycontent-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/heycontent-web:latest'
