name: Sync Dev with Main

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-dev:
    name: Sync Dev Branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper sync
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Sync dev branch with main using GitHub API
        id: sync-dev
        uses: actions/github-script@v7
        with:
          script: |
            console.log("🔄 Syncing dev branch with main using GitHub API...");
            
            try {
              // Get the current commit SHA of main branch
              const { data: mainRef } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main'
              });
              
              const mainSha = mainRef.object.sha;
              console.log(`Main branch SHA: ${mainSha}`);
              
              // Update dev branch to point to the same commit as main
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/dev',
                sha: mainSha,
                force: true
              });
              
              console.log("✅ Dev branch successfully synced with main");
              core.exportVariable('SYNC_STATUS', 'success');
              
            } catch (error) {
              console.error("❌ Failed to sync dev branch:", error);
              core.exportVariable('SYNC_STATUS', 'failed');
              throw error;
            }
      
      - name: Checkout updated dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify sync success
        run: |
          echo "📊 Sync Summary:"
          echo "- Dev Sync: ${{ env.SYNC_STATUS }}"
          echo ""
          echo "✅ All operations completed successfully"

  handle-sync-failure:
    name: Handle Sync Failures
    runs-on: ubuntu-latest
    needs: [sync-dev]
    if: failure()
    
    steps:
      - name: Log sync failure
        run: echo "Dev sync failed but no issue will be created"

  notify-success:
    name: Notify Successful Sync
    runs-on: ubuntu-latest
    needs: [sync-dev]
    if: success()
    
    steps:
      - name: Add commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const commentBody = `## ✅ Dev Environment Successfully Synced
            
            **Sync Status**: 🟢 Complete
            **Operations Completed**:
            - ✅ Dev branch synced with main
            
            **Dev Branch Status**: Now matches main exactly
            **Next Steps**: Development can continue on updated dev branch
            
            **Quick Commands for Developers:**
            \`\`\`bash
            # Pull latest dev changes
            git checkout dev
            git pull origin dev
            
            # Create new feature branch
            git checkout -b feature/your-feature-name
            \`\`\`
            
            **Environment Ready**: Dev branch ready for new feature development
            
            ---
            *Auto-synced: main → dev*`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });