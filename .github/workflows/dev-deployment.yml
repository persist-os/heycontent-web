name: Dev Environment Ready

on:
  push:
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: read

jobs:
  verify-deployment:
    name: Verify Dev Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Wait for Vercel deployment
        run: |
          echo "Waiting for Vercel auto-deployment to complete..."
          sleep 120  # Give Vercel 2 minutes to deploy
      
      - name: Health check dev environment
        id: health-check
        run: |
          echo "Checking dev environment health..."
          
          # Check if the site is accessible
          for i in {1..10}; do
            if curl -f -s https://heycontent-web-git-dev-divertissement-ai.vercel.app > /dev/null; then
              echo "✅ Dev site is accessible"
              echo "HEALTH_STATUS=success" >> $GITHUB_ENV
              break
            else
              echo "⏳ Attempt $i: Site not ready yet, waiting..."
              sleep 30
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ Dev site failed health check after 10 attempts"
              echo "HEALTH_STATUS=failed" >> $GITHUB_ENV
              exit 1
            fi
          done
      
      - name: Verify site functionality
        id: functionality-check
        run: |
          # Basic HTTP status check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://heycontent-web-git-dev-divertissement-ai.vercel.app)
          
          if [ $STATUS -eq 200 ]; then
            echo "✅ Dev site returns 200 OK"
            echo "FUNC_STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Dev site returned status: $STATUS"
            echo "FUNC_STATUS=failed" >> $GITHUB_ENV
            exit 1
          fi

  handle-deployment-issues:
    name: Handle Deployment Issues
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: failure()
    
    steps:
      - name: Create dev deployment failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            const author = context.payload.head_commit?.author?.name || 'Unknown';
            
            const issueBody = `## 🚨 Dev Environment Deployment Failed
            
            **Deployment Failure Details:**
            - **Commit**: \`${commitSha}\`
            - **Message**: ${commitMessage}
            - **Author**: ${author}
            - **Time**: ${new Date().toISOString()}
            - **Branch**: dev
            
            **Failure Type**: Dev environment health check failed
            
            **Immediate Investigation Required:**
            @MyatPyaePaingPie - Dev deployment verification failed, blocking production pipeline
            
            **Investigation Checklist:**
            - [ ] Check [Vercel deployment status](https://vercel.com/divertissement-ai/heycontent-web/deployments)
            - [ ] Review [GitHub Actions logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - [ ] Test dev site manually: https://heycontent-web-git-dev-divertissement-ai.vercel.app
            - [ ] Check for build/runtime errors in Vercel logs
            - [ ] Verify environment variables are properly set
            
            **Possible Root Causes:**
            - [ ] Vercel deployment failed or timed out
            - [ ] Site returning error status codes (5xx, 4xx)
            - [ ] Network connectivity issues
            - [ ] Environment configuration problems
            - [ ] Breaking changes in recent commits
            
            **Resolution Steps:**
            1. **Identify**: Determine root cause from logs and manual testing
            2. **Fix**: Address the underlying issue (redeploy, fix code, update config)
            3. **Verify**: Ensure dev environment is fully functional
            4. **Notify**: Update this issue when resolved
            
            **Impact**: 🔴 **HIGH** - Dev environment unavailable, production promotion blocked
            
            **Escalation**: If not resolved within 2 hours, consider:
            - Reverting the problematic commit
            - Emergency hotfix deployment
            - Manual intervention in Vercel dashboard
            
            ---
            *Auto-generated from failed dev deployment - production pipeline halted*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Dev Deployment Failed: ${commitSha}`,
              body: issueBody,
              labels: ['dev-deployment-failure', 'urgent', 'needs-MyatPyaePaingPie-review', 'pipeline-blocked'],
              assignees: ['MyatPyaePaingPie']
            });

  notify-readiness:
    name: Notify Production Readiness Review
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: success()
    
    steps:
      - name: Close previous review issues
        uses: actions/github-script@v7
        with:
          script: |
            // Find and close any existing production review issues
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'production-review',
              state: 'open'
            });
            
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '🔄 **Superseded by new dev deployment** - Closing this review as dev environment has been updated.'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: ['production-review', 'superseded']
              });
            }
      
      - name: Create production readiness review issue
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            const author = context.payload.head_commit?.author?.name || 'Unknown';
            
            const issueBody = `## 🔧 Production Readiness Review Required
            
            **Dev Environment Successfully Updated**
            
            **Latest Changes:**
            - **Commit**: \`${commitSha}\`
            - **Message**: ${commitMessage}
            - **Author**: ${author}
            - **Deployed**: ${new Date().toISOString()}
            
            **Environment URLs:**
            - 🔧 **Dev Frontend**: https://heycontent-web-git-dev-divertissement-ai.vercel.app
            - 🔧 **Dev Backend**: https://backend.hicontent.co (if applicable)
            
            **Production Readiness Checklist:**
            @MyatPyaePaingPie - Please review and check off each item:
            
            **Functionality Review:**
            - [ ] ✅ Core features work correctly in dev environment
            - [ ] ✅ New functionality performs as expected
            - [ ] ✅ User flows complete successfully
            - [ ] ✅ No breaking changes or regressions
            
            **Performance & Quality:**
            - [ ] ✅ Page load times are acceptable
            - [ ] ✅ No console errors or warnings
            - [ ] ✅ Mobile responsiveness maintained
            - [ ] ✅ Performance meets standards
            
            **Integration & Security:**
            - [ ] ✅ Backend integration working (if applicable)
            - [ ] ✅ Authentication flows functional
            - [ ] ✅ No security vulnerabilities introduced
            - [ ] ✅ Environment variables properly configured
            
            **Production Deployment Process:**
            Once all items are checked and approved:
            
            1. **Create Production PR**: 
               - Base: \`main\` ← Compare: \`dev\`
               - Title: "Production Release: ${commitMessage}"
               
            2. **Get Final Approval**: 
               - Tag @Shreyboiii for production approval
               - Tag COO if major changes
               
            3. **Deploy**: 
               - Merge PR to trigger production deployment
               - Monitor deployment success
            
            **Quick Test Links:**
            - [🏠 Homepage](https://heycontent-web-git-dev-divertissement-ai.vercel.app)
            - [🔐 Login](https://heycontent-web-git-dev-divertissement-ai.vercel.app/sign-in)
            - [⚙️ Dashboard](https://heycontent-web-git-dev-divertissement-ai.vercel.app/dashboard)
            
            **Priority**: Ready for production when all checks complete ✅
            
            ---
            *Auto-generated production readiness review*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Production Review: ${commitSha} Ready`,
              body: issueBody,
              labels: ['production-review', 'needs-MyatPyaePaingPie-review', 'ready-for-review'],
              assignees: ['MyatPyaePaingPie']
            });
      
      - name: Notify on commit
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const commentBody = `## ✅ Dev Environment Deployment Successful
            
            **Status**: 🟢 Ready for production review
            **Health Check**: ✅ All systems operational
            **Dev URL**: https://heycontent-web-git-dev-divertissement-ai.vercel.app
            
            **Next Steps**: 
            @MyatPyaePaingPie - Production readiness review issue created automatically
            
            **Quick Access:**
            - [🏠 Test Homepage](https://heycontent-web-git-dev-divertissement-ai.vercel.app)
            - [🔐 Test Login](https://heycontent-web-git-dev-divertissement-ai.vercel.app/sign-in)
            - [📋 Review Checklist](${context.payload.repository.html_url}/issues?q=is%3Aopen+label%3Aproduction-review)
            
            **Deployment Pipeline**: Dev ✅ → Production Review → Main → Live 🚀
            
            ---
            *Dev environment ready - awaiting production review*`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });