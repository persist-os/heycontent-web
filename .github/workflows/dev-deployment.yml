name: Sync Dev with Main and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-dev-and-deploy:
    name: Sync Dev Branch and Deploy Convex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper sync
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Sync dev branch with main
        id: sync-dev
        run: |
          echo "🔄 Syncing dev branch with main..."
          
          # Delete the remote dev branch
          git push origin --delete dev || echo "Dev branch may not exist remotely"
          
          # Create and checkout new dev branch from main
          git checkout main
          git checkout -b dev
          
          # Push the new dev branch
          git push origin dev
          
          echo "✅ Dev branch successfully synced with main"
          echo "SYNC_STATUS=success" >> $GITHUB_ENV
        continue-on-error: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Deploy to Convex
        id: convex-deploy
        run: |
          echo "🚀 Deploying to Convex..."
          npx convex deploy
          echo "✅ Convex deployment completed"
          echo "CONVEX_STATUS=success" >> $GITHUB_ENV
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        continue-on-error: false
      
      - name: Verify deployment success
        run: |
          echo "📊 Deployment Summary:"
          echo "- Dev Sync: ${{ env.SYNC_STATUS }}"
          echo "- Convex Deploy: ${{ env.CONVEX_STATUS }}"
          echo ""
          echo "✅ All operations completed successfully"

  handle-sync-failure:
    name: Handle Sync/Deploy Failures
    runs-on: ubuntu-latest
    needs: [sync-dev-and-deploy]
    if: failure()
    
    steps:
      - name: Create sync failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            const author = context.payload.head_commit?.author?.name || 'Unknown';
            
            const issueBody = `## 🚨 Dev Sync/Deploy Failed
            
            **Main Branch Update Failed to Sync to Dev**
            
            **Failure Details:**
            - **Commit**: \`${commitSha}\`
            - **Message**: ${commitMessage}
            - **Author**: ${author}
            - **Time**: ${new Date().toISOString()}
            - **Branch**: main → dev (sync failed)
            
            **Failed Operations:**
            The automated sync from main to dev branch failed. This could be due to:
            - Git sync issues (merge conflicts, branch protection)
            - Convex deployment failures
            - Network/authentication issues
            
            **Manual Recovery Required:**
            @MyatPyaePaingPie - Immediate attention needed
            
            **Manual Sync Steps:**
            \`\`\`bash
            # 1. Sync dev branch manually
            git checkout dev
            git reset --hard origin/main
            git push origin dev --force
            
            # 2. Deploy to Convex
            npm ci
            npx convex deploy
            \`\`\`
            
            **Investigation Checklist:**
            - [ ] Check [GitHub Actions logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - [ ] Verify branch protection rules on dev branch
            - [ ] Check Convex deployment key configuration
            - [ ] Test manual sync process
            - [ ] Verify no blocking issues in dev branch
            
            **Root Cause Analysis:**
            - [ ] Git operation failure (permissions, conflicts)
            - [ ] Convex authentication/deployment issues
            - [ ] Repository configuration problems
            - [ ] Network/infrastructure issues
            
            **Resolution Priority**: 🔴 **HIGH**
            Dev branch out of sync with main blocks development workflow
            
            **Next Steps:**
            1. Investigate root cause from workflow logs
            2. Perform manual sync if needed
            3. Fix underlying issue to prevent recurrence
            4. Update workflow if necessary
            
            ---
            *Auto-generated from failed dev sync - manual intervention required*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Dev Sync Failed: ${commitSha}`,
              body: issueBody,
              labels: ['dev-sync-failure', 'urgent', 'needs-MyatPyaePaingPie-review', 'manual-intervention'],
              assignees: ['MyatPyaePaingPie']
            });

  notify-success:
    name: Notify Successful Sync
    runs-on: ubuntu-latest
    needs: [sync-dev-and-deploy]
    if: success()
    
    steps:
      - name: Add commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const commentBody = `## ✅ Dev Environment Successfully Synced
            
            **Sync Status**: 🟢 Complete
            **Operations Completed**:
            - ✅ Dev branch synced with main
            - ✅ Convex deployment successful
            
            **Dev Branch Status**: Now matches main exactly
            **Next Steps**: Development can continue on updated dev branch
            
            **Quick Commands for Developers:**
            \`\`\`bash
            # Pull latest dev changes
            git checkout dev
            git pull origin dev
            
            # Create new feature branch
            git checkout -b feature/your-feature-name
            \`\`\`
            
            **Environment Ready**: Dev branch ready for new feature development
            
            ---
            *Auto-synced: main → dev*`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });