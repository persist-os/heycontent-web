name: Dev Environment Ready

on:
  push:
    branches: [dev]

jobs:
  verify-deployment:
    name: Verify Dev Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for Vercel deployment
        run: |
          echo "Waiting for Vercel auto-deployment to complete..."
          sleep 120  # Give Vercel 2 minutes to deploy
      
      - name: Health check dev environment
        run: |
          echo "Checking dev environment health..."
          
          # Check if the site is accessible
          for i in {1..10}; do
            if curl -f -s https://heycontent-web-git-dev-divertissement-ai.vercel.app > /dev/null; then
              echo "✅ Dev site is accessible"
              break
            else
              echo "⏳ Attempt $i: Site not ready yet, waiting..."
              sleep 30
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ Dev site failed health check after 10 attempts"
              exit 1
            fi
          done
      
      - name: Check dev site loads properly
        run: |
          # Basic HTTP status check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://heycontent-web-git-dev-divertissement-ai.vercel.app)
          
          if [ $STATUS -eq 200 ]; then
            echo "✅ Dev site returns 200 OK"
          else
            echo "❌ Dev site returned status: $STATUS"
            exit 1
          fi

  notify-readiness:
    name: Notify Production Readiness Review
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    
    steps:
      - name: Create production readiness issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'production-review',
              state: 'open'
            });
            
            // Close any existing production review issues
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
            
            // Create new production review issue
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const issueBody = `## 🔧 Dev Environment Updated - Production Review Needed
            
            **Latest Changes:**
            - **Commit**: \`${commitSha}\`
            - **Message**: ${commitMessage}
            - **Author**: ${context.payload.head_commit?.author?.name || 'Unknown'}
            
            **Environment URLs:**
            - 🔧 **Dev Frontend**: https://heycontent-web-git-dev-divertissement-ai.vercel.app
            - 🔧 **Dev Backend**: https://backend.hicontent.co (if deployed)
            
            **Production Readiness Checklist:**
            - [ ] ✅ Functionality works correctly in dev
            - [ ] ✅ Performance meets standards  
            - [ ] ✅ No regressions introduced
            - [ ] ✅ Ready for user traffic
            - [ ] ✅ Backend integration working (if applicable)
            
            **Next Steps:**
            @MyatPyaePaingPie - Please review the dev environment and check off the items above. When ready:
            1. Create PR: \`dev\` → \`main\` 
            2. Tag @Shreyboiii and COO for final approval
            3. Merge to trigger production deployment
            
            ---
            *Auto-generated from dev deployment*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Production Review: Dev Updated (${commitSha})`,
              body: issueBody,
              labels: ['production-review', 'needs-MyatPyaePaingPie-review'],
              assignees: ['MyatPyaePaingPie']
            });
      
      - name: Post deployment notification
        uses: actions/github-script@v7
        with:
          script: |
            // Comment on the commit that triggered this
            const commitSha = context.sha;
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const commentBody = `## ✅ Dev Environment Deployment Complete
            
            **Status**: Successfully deployed to dev environment
            **Health Check**: ✅ Passed
            **Dev URL**: https://heycontent-web-git-dev-divertissement-ai.vercel.app
            
            @MyatPyaePaingPie - Dev environment is ready for your production readiness review.
            
            **Quick Test Links:**
            - [🏠 Homepage](https://heycontent-web-git-dev-divertissement-ai.vercel.app)
            - [🔐 Login](https://heycontent-web-git-dev-divertissement-ai.vercel.app/sign-in)
            
            Production review issue created automatically.`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });