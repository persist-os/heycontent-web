name: Frontend Quality Gate

on:
  pull_request:
    branches: [dev]
    paths: ['**'] # Run on any changes

jobs:
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Vercel default, or specify your preferred version
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type checking
        run: npx tsc --noEmit
      
      - name: Lint code
        run: npm run lint
      
      - name: Run tests
        run: npm run test -- --passWithNoTests --watchAll=false
        env:
          CI: true
      
      - name: Build verification
        run: npm run build
        env:
          # Use development values for build test
          NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
          # Include all your public env vars for build
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      
      - name: Security audit
        run: npm audit --audit-level moderate --production
        continue-on-error: true

  quality-report:
    name: Quality Assessment
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    if: always()
    
    steps:
      - name: Production Readiness Report
        uses: actions/github-script@v7
        with:
          script: |
            const frontendResult = '${{ needs.frontend-quality.result }}';
            
            let message = '## 🔍 Frontend Production Readiness Assessment\n\n';
            message += `**Frontend Quality**: ${frontendResult === 'success' ? '✅ READY' : '❌ BLOCKED'}\n\n`;
            
            if (frontendResult === 'success') {
              message += '🚀 **FRONTEND READY** - All quality gates passed. Ready for dev deployment and your review @paing.';
            } else {
              message += '⚠️ **BLOCKED** - Frontend quality checks failed. Address issues before dev deployment.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });