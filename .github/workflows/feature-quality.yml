name: Frontend Quality Gate

on:
  pull_request:
    branches: [dev]
    paths: ['**'] # Run on any changes

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: read

jobs:
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type checking
        id: typecheck
        run: |
          echo "Running TypeScript type checking..."
          npx tsc --noEmit 2>&1 | tee typecheck.log || echo "TYPECHECK_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
      
      - name: Lint code
        id: lint
        run: |
          echo "Running ESLint..."
          npm run lint 2>&1 | tee lint.log || echo "LINT_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
      
      - name: Run tests
        id: tests
        run: |
          echo "Running tests..."
          npm run test -- --passWithNoTests --watchAll=false 2>&1 | tee test.log || echo "TESTS_FAILED=true" >> $GITHUB_ENV
        env:
          CI: true
        continue-on-error: true
      
      - name: Build verification
        id: build
        run: |
          echo "Running build..."
          npm run build 2>&1 | tee build.log || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        continue-on-error: true
      
      - name: Security audit
        id: security
        run: |
          echo "Running security audit..."
          npm audit --audit-level high --production 2>&1 | tee security.log
          if npm audit --audit-level high --production >/dev/null 2>&1; then
            echo "SECURITY_STATUS=passed" >> $GITHUB_ENV
          else
            echo "SECURITY_STATUS=failed" >> $GITHUB_ENV
            echo "SECURITY_FAILED=true" >> $GITHUB_ENV
          fi
        continue-on-error: true
      
      - name: Capture error details
        if: always()
        run: |
          echo "=== CAPTURING ERROR DETAILS ===" 
          
          # Capture TypeScript errors
          if [ "${{ env.TYPECHECK_FAILED }}" = "true" ] && [ -f typecheck.log ]; then
            echo "TYPECHECK_ERRORS<<EOF" >> $GITHUB_ENV
            head -20 typecheck.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          # Capture lint errors  
          if [ "${{ env.LINT_FAILED }}" = "true" ] && [ -f lint.log ]; then
            echo "LINT_ERRORS<<EOF" >> $GITHUB_ENV
            head -20 lint.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          # Capture test errors
          if [ "${{ env.TESTS_FAILED }}" = "true" ] && [ -f test.log ]; then
            echo "TEST_ERRORS<<EOF" >> $GITHUB_ENV
            tail -20 test.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          # Capture build errors
          if [ "${{ env.BUILD_FAILED }}" = "true" ] && [ -f build.log ]; then
            echo "BUILD_ERRORS<<EOF" >> $GITHUB_ENV
            tail -20 build.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          # Capture security issues
          if [ "${{ env.SECURITY_FAILED }}" = "true" ] && [ -f security.log ]; then
            echo "SECURITY_ERRORS<<EOF" >> $GITHUB_ENV
            cat security.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
      
      - name: Determine overall status
        id: status
        run: |
          TYPECHECK_STATUS="${{ steps.typecheck.outcome }}"
          LINT_STATUS="${{ steps.lint.outcome }}"
          TESTS_STATUS="${{ steps.tests.outcome }}"
          BUILD_STATUS="${{ steps.build.outcome }}"
          
          if [[ "$TYPECHECK_STATUS" == "success" && "$LINT_STATUS" == "success" && "$TESTS_STATUS" == "success" && "$BUILD_STATUS" == "success" ]]; then
            echo "OVERALL_STATUS=success" >> $GITHUB_ENV
          else
            echo "OVERALL_STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi

  quality-assessment:
    name: Quality Assessment & Issue Creation
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    if: always()
    
    steps:
      - name: PR Quality Report
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const frontendResult = '${{ needs.frontend-quality.result }}';
            const prNumber = context.payload.pull_request?.number;
            
            if (!prNumber) {
              console.log('No PR number available, skipping PR comment');
              return;
            }
            
            // Get step outcomes directly from the job
            const typecheckStatus = '${{ steps.typecheck.outcome }}' || 'unknown';
            const lintStatus = '${{ steps.lint.outcome }}' || 'unknown';
            const testsStatus = '${{ steps.tests.outcome }}' || 'unknown';
            const buildStatus = '${{ steps.build.outcome }}' || 'unknown';
            const securityStatus = '${{ env.SECURITY_STATUS }}' || 'unknown';
            
            let message = '## 🔍 Frontend Quality Assessment\n\n';
            message += `**Overall Status**: ${frontendResult === 'success' ? '✅ READY' : '❌ BLOCKED'}\n\n`;
            message += '**Detailed Results:**\n';
            message += `- TypeScript: ${typecheckStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Linting: ${lintStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Tests: ${testsStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Build: ${buildStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Security: ${securityStatus === 'passed' ? '✅' : '❌'}\n\n`;
            
            if (frontendResult === 'success') {
              message += '🚀 **READY FOR DEV** - All quality gates passed. @MyatPyaePaingPie ready for your review.';
            } else {
              message += '⚠️ **BLOCKED** - Quality issues must be resolved before merging to dev.\n\n';
              message += 'Issues will be created automatically for tracking and resolution.';
            }
            
            try {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
              
              console.log(`Posted quality report comment on PR #${prNumber}`);
            } catch (error) {
              console.log('Error posting PR comment:', error);
            }

      - name: Create quality failure issue
        if: needs.frontend-quality.result == 'failure'
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            // Get PR details safely
            const prNumber = context.payload.pull_request?.number;
            const branchName = context.payload.pull_request?.head?.ref;
            const author = context.payload.pull_request?.user?.login;
            const prTitle = context.payload.pull_request?.title;
            const commitSha = context.payload.pull_request?.head?.sha?.substring(0, 7);
            
            if (!prNumber || !branchName || !author) {
              console.log('Missing PR context, skipping issue creation');
              return;
            }
            
            // Check for existing quality failure issues for this PR
            try {
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'quality-failure',
                state: 'open'
              });
              
              const existingIssue = existingIssues.find(issue => 
                issue.title.includes(`PR #${prNumber}`) || issue.title.includes(branchName)
              );
              
              if (existingIssue) {
                console.log(`Quality failure issue already exists: #${existingIssue.number}`);
                return;
              }
            } catch (error) {
              console.log('Error checking existing issues:', error);
            }
            
            // Get failure details with actual errors
            const typecheckFailed = '${{ env.TYPECHECK_FAILED }}' === 'true';
            const lintFailed = '${{ env.LINT_FAILED }}' === 'true';
            const testsFailed = '${{ env.TESTS_FAILED }}' === 'true';
            const buildFailed = '${{ env.BUILD_FAILED }}' === 'true';
            
            let failedChecks = [];
            let errorDetails = '';
            
            if (typecheckFailed) {
              failedChecks.push('TypeScript compilation');
              const typecheckErrors = `${{ env.TYPECHECK_ERRORS }}`;
              if (typecheckErrors) {
                errorDetails += '### 🔴 TypeScript Errors:\n```\n' + typecheckErrors + '\n```\n\n';
              }
            }
            
            if (lintFailed) {
              failedChecks.push('Code linting');
              const lintErrors = `${{ env.LINT_ERRORS }}`;
              if (lintErrors) {
                errorDetails += '### 🔴 Linting Errors:\n```\n' + lintErrors + '\n```\n\n';
              }
            }
            
            if (testsFailed) {
              failedChecks.push('Unit tests');
              const testErrors = `${{ env.TEST_ERRORS }}`;
              if (testErrors) {
                errorDetails += '### 🔴 Test Failures:\n```\n' + testErrors + '\n```\n\n';
              }
            }
            
            if (buildFailed) {
              failedChecks.push('Build process');
              const buildErrors = `${{ env.BUILD_ERRORS }}`;
              if (buildErrors) {
                errorDetails += '### 🔴 Build Errors:\n```\n' + buildErrors + '\n```\n\n';
              }
            }
            
            const issueBody = `## ❌ Quality Gate Failure
            
            **Pull Request**: #${prNumber} - ${prTitle || 'PR'}
            **Branch**: \`${branchName}\`
            **Author**: @${author}
            **Commit**: \`${commitSha || 'unknown'}\`
            
            **Failed Checks**: ${failedChecks.length > 0 ? failedChecks.join(', ') : 'See workflow logs for details'}
            
            ${errorDetails}
            
            **Actions Required:**
            ${failedChecks.map(check => `- [ ] Fix ${check} issues`).join('\n') || '- [ ] Review workflow logs and fix identified issues'}
            
            **Quick Fix Commands:**
            \`\`\`bash
            # Fix common issues
            npm run lint -- --fix        # Auto-fix linting issues
            npx tsc --noEmit             # Check TypeScript errors
            npm test                     # Run tests locally
            npm run build                # Test build process
            \`\`\`
            
            **Investigation Steps:**
            1. Review the error details above
            2. Check the [full workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) if needed
            3. Fix the identified issues locally
            4. Commit and push your fixes
            5. Quality checks will re-run automatically
            
            **Ownership:**
            - **Developer**: @${author} (fix issues)
            - **Review**: @MyatPyaePaingPie (after fixes completed)
            
            ---
            *Auto-generated from failed quality gate - will close when issues are resolved*`;
            
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Quality Issues: ${branchName} (PR #${prNumber})`,
                body: issueBody,
                labels: ['quality-failure', 'needs-fix', 'automated'],
                assignees: [author]
              });
              
              console.log(`Created quality failure issue: #${issue.data.number}`);
            } catch (error) {
              console.log('Error creating quality failure issue:', error);
            }

      - name: Create security issue
        if: env.SECURITY_STATUS == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR details safely  
            const prNumber = context.payload.pull_request?.number;
            const branchName = context.payload.pull_request?.head?.ref;
            const author = context.payload.pull_request?.user?.login;
            const prTitle = context.payload.pull_request?.title;
            const commitSha = context.payload.pull_request?.head?.sha?.substring(0, 7);
            
            if (!prNumber || !branchName || !author) {
              console.log('Missing PR context, skipping security issue creation');
              return;
            }
            
            const issueBody = `## 🔒 Security Vulnerabilities Detected
            
            **Pull Request**: #${prNumber} - ${prTitle || 'PR'}
            **Branch**: \`${branchName}\`
            **Author**: @${author}
            **Commit**: \`${commitSha || 'unknown'}\`
            
            **Security Alert**: High or critical vulnerabilities found in dependencies
            
            ### 🔴 Security Issues Found:
            \`\`\`
            ${{ env.SECURITY_ERRORS }}
            \`\`\`
            
            **Immediate Actions Required:**
            1. **Investigate**: \`npm audit --audit-level high\`
            2. **Fix automatically**: \`npm audit fix\`
            3. **Manual fixes**: \`npm audit fix --force\` (review changes carefully)
            4. **Test**: \`npm test && npm run build\`
            5. **Commit fixes**: Update package-lock.json and push
            
            **Security Fix Commands:**
            \`\`\`bash
            # Check all vulnerabilities
            npm audit
            
            # Check high/critical only
            npm audit --audit-level high
            
            # Auto-fix when possible (safe)
            npm audit fix
            
            # Force fix breaking changes (REVIEW CAREFULLY!)
            npm audit fix --force
            
            # Verify everything still works
            npm test
            npm run build
            \`\`\`
            
            **Priority**: 🔴 **HIGH** - Security vulnerabilities block production deployment
            
            **Ownership:**
            - **Fix**: @${author}
            - **Security Review**: @MyatPyaePaingPie
            
            ---
            *Auto-generated security alert - must be resolved before production*`;
            
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Alert: ${branchName} (PR #${prNumber})`,
                body: issueBody,
                labels: ['security', 'vulnerability', 'urgent', 'needs-fix'],
                assignees: [author, 'MyatPyaePaingPie']
              });
              
              console.log(`Created security issue: #${issue.data.number}`);
            } catch (error) {
              console.log('Error creating security issue:', error);
            }