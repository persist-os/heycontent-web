name: Frontend Quality Gate

on:
  pull_request:
    branches: [dev, main]
    paths: ['**'] # Run on any changes

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: read

jobs:
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    outputs:
      typecheck-result: ${{ steps.set_typecheck_output.outputs.result }}
      lint-result: ${{ steps.set_lint_output.outputs.result }}
      tests-result: ${{ steps.set_tests_output.outputs.result }}
      build-result: ${{ steps.set_build_output.outputs.result }}
      security-result: ${{ steps.set_security_output.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type checking
        id: typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Set typecheck output
        if: always()
        id: set_typecheck_output
        run: echo "result=${{ steps.typecheck.outcome }}" >> $GITHUB_OUTPUT
      
      - name: Lint code
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: Set lint output
        if: always()
        id: set_lint_output
        run: echo "result=${{ steps.lint.outcome }}" >> $GITHUB_OUTPUT
      
      - name: Run tests
        id: tests
        run: npm run test -- --passWithNoTests --watchAll=false
        env:
          CI: true
        continue-on-error: true
      - name: Set tests output
        if: always()
        id: set_tests_output
        run: echo "result=${{ steps.tests.outcome }}" >> $GITHUB_OUTPUT
      
      - name: Build verification
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        continue-on-error: true
      - name: Set build output
        if: always()
        id: set_build_output
        run: echo "result=${{ steps.build.outcome }}" >> $GITHUB_OUTPUT
      
      - name: Security audit
        id: security
        run: |
          echo "Running security audit..."
          if npm audit --audit-level high --production; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: Set security output
        if: always()
        id: set_security_output
        run: echo "result=${{ steps.security.outputs.result }}" >> $GITHUB_OUTPUT

  quality-assessment:
    name: Quality Assessment & Issue Creation
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          TYPECHECK_STATUS="${{ needs.frontend-quality.outputs.typecheck-result }}"
          LINT_STATUS="${{ needs.frontend-quality.outputs.lint-result }}"
          TESTS_STATUS="${{ needs.frontend-quality.outputs.tests-result }}"
          BUILD_STATUS="${{ needs.frontend-quality.outputs.build-result }}"
          SECURITY_STATUS="${{ needs.frontend-quality.outputs.security-result }}"
          if [[ "$TYPECHECK_STATUS" == "success" && "$LINT_STATUS" == "success" && "$TESTS_STATUS" == "success" && "$BUILD_STATUS" == "success" ]]; then
            echo "overall=success" >> $GITHUB_OUTPUT
          else
            echo "overall=failure" >> $GITHUB_OUTPUT
          fi
          echo "typecheck=$TYPECHECK_STATUS" >> $GITHUB_OUTPUT
          echo "lint=$LINT_STATUS" >> $GITHUB_OUTPUT
          echo "tests=$TESTS_STATUS" >> $GITHUB_OUTPUT
          echo "build=$BUILD_STATUS" >> $GITHUB_OUTPUT
          echo "security=$SECURITY_STATUS" >> $GITHUB_OUTPUT

      - name: PR Quality Report
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              console.log('No PR number available, skipping PR comment');
              return;
            }
            const typecheckStatus = '${{ steps.status.outputs.typecheck }}';
            const lintStatus = '${{ steps.status.outputs.lint }}';
            const testsStatus = '${{ steps.status.outputs.tests }}';
            const buildStatus = '${{ steps.status.outputs.build }}';
            const securityStatus = '${{ steps.status.outputs.security }}';
            const overallStatus = '${{ steps.status.outputs.overall }}';
            let message = '## 🔍 Frontend Quality Assessment\n\n';
            message += `**Overall Status**: ${overallStatus === 'success' ? '✅ READY' : '❌ BLOCKED'}\n\n`;
            message += '**Detailed Results:**\n';
            message += `- TypeScript: ${typecheckStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Linting: ${lintStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Tests: ${testsStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Build: ${buildStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Security: ${securityStatus === 'passed' ? '✅' : '❌'}\n\n`;
            if (overallStatus === 'success') {
              message += '🚀 **READY FOR DEV** - All quality gates passed. @ariaxhan ready for your review.';
            } else {
              message += '⚠️ **BLOCKED** - Quality issues must be resolved before merging to dev.\n\n';
              message += 'Issues will be created automatically for tracking and resolution.';
            }
            try {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
              console.log(`Posted quality report comment on PR #${prNumber}`);
            } catch (error) {
              console.log('Error posting PR comment:', error);
            }

      - name: Create quality failure issue
        if: steps.status.outputs.overall == 'failure'
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const prNumber = context.payload.pull_request?.number;
            const branchName = context.payload.pull_request?.head?.ref;
            const author = context.payload.pull_request?.user?.login;
            const prTitle = context.payload.pull_request?.title;
            const commitSha = context.payload.pull_request?.head?.sha?.substring(0, 7);
            if (!prNumber || !branchName || !author) {
              console.log('Missing PR context, skipping issue creation');
              return;
            }
            try {
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'quality-failure',
                state: 'open'
              });
              const existingIssue = existingIssues.find(issue => 
                issue.title.includes(`PR #${prNumber}`) || issue.title.includes(branchName)
              );
              if (existingIssue) {
                console.log(`Quality failure issue already exists: #${existingIssue.number}`);
                return;
              }
            } catch (error) {
              console.log('Error checking existing issues:', error);
            }
            const typecheckStatus = '${{ steps.status.outputs.typecheck }}';
            const lintStatus = '${{ steps.status.outputs.lint }}';
            const testsStatus = '${{ steps.status.outputs.tests }}';
            const buildStatus = '${{ steps.status.outputs.build }}';
            let failedChecks = [];
            if (typecheckStatus === 'failure') failedChecks.push('TypeScript compilation');
            if (lintStatus === 'failure') failedChecks.push('Code linting');
            if (testsStatus === 'failure') failedChecks.push('Unit tests');
            if (buildStatus === 'failure') failedChecks.push('Build process');
            const issueBody = `## ❌ Quality Gate Failure\n\n**Pull Request**: #${prNumber} - ${prTitle || 'PR'}\n**Branch**: \`${branchName}\`\n**Author**: @${author}\n**Commit**: \`${commitSha || 'unknown'}\`\n\n**Failed Checks**: ${failedChecks.length > 0 ? failedChecks.join(', ') : 'See workflow logs for details'}\n\n**Actions Required:**\n${failedChecks.map(check => `- [ ] Fix ${check} issues`).join('\n') || '- [ ] Review workflow logs and fix identified issues'}\n\n**Investigation Steps:**\n1. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for detailed logs\n2. Run checks locally:\n   \`\`\`bash\n   npm run lint          # Fix linting issues\n   npx tsc --noEmit      # Check TypeScript errors\n   npm test              # Run tests\n   npm run build         # Test build\n   \`\`\`\n3. Fix identified issues and push updates\n4. Re-run quality checks\n\n**Ownership:**\n- **Developer**: @${author} (fix issues)\n- **Review**: @ariaxhan (after fixes completed)\n\n---\n*Auto-generated from failed quality gate - closes automatically when issues resolved*`;
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Quality Issues: ${branchName} (PR #${prNumber})`,
                body: issueBody,
                labels: ['quality-failure', 'needs-fix', 'automated'],
                assignees: [author]
              });
              console.log(`Created quality failure issue: #${issue.data.number}`);
            } catch (error) {
              console.log('Error creating quality failure issue:', error);
            }

      - name: Create security issue
        if: steps.status.outputs.security == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            const branchName = context.payload.pull_request?.head?.ref;
            const author = context.payload.pull_request?.user?.login;
            const prTitle = context.payload.pull_request?.title;
            const commitSha = context.payload.pull_request?.head?.sha?.substring(0, 7);
            if (!prNumber || !branchName || !author) {
              console.log('Missing PR context, skipping security issue creation');
              return;
            }
            const issueBody = `## 🔒 Security Vulnerabilities Detected\n\n**Pull Request**: #${prNumber} - ${prTitle || 'PR'}\n**Branch**: \`${branchName}\`\n**Author**: @${author}\n**Commit**: \`${commitSha || 'unknown'}\`\n\n**Security Alert**: High or critical vulnerabilities found in dependencies\n\n**Immediate Actions Required:**\n1. **Investigate**: \`npm audit --audit-level high\`\n2. **Fix automatically**: \`npm audit fix\`\n3. **Manual fixes**: \`npm audit fix --force\` (review changes carefully)\n4. **Test**: \`npm test && npm run build\`\n5. **Commit fixes**: Update package-lock.json and push\n\n**Security Commands:**\n\`\`\`bash\n# Check vulnerabilities\nnpm audit --audit-level high\n\n# Auto-fix when possible\nnpm audit fix\n\n# Force fix (review changes!)\nnpm audit fix --force\n\n# Verify everything still works\nnpm test\nnpm run build\n\`\`\`\n\n**Priority**: 🔴 **HIGH** - Security vulnerabilities block production deployment\n\n**Ownership:**\n- **Fix**: @${author}\n- **Security Review**: @ariaxhan\n\n---\n*Auto-generated security alert - must be resolved before production*`;
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Alert: ${branchName} (PR #${prNumber})`,
                body: issueBody,
                labels: ['security', 'vulnerability', 'urgent', 'needs-fix'],
                assignees: [author, 'MyatPyaePaingPie']
              });
              console.log(`Created security issue: #${issue.data.number}`);
            } catch (error) {
              console.log('Error creating security issue:', error);
            }