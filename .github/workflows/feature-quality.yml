name: Frontend Quality Gate

on:
  pull_request:
    branches: [dev]
    paths: ['**'] # Run on any changes

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: read

jobs:
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type checking
        id: typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Lint code
        id: lint
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests
        id: tests
        run: npm run test -- --passWithNoTests --watchAll=false
        env:
          CI: true
        continue-on-error: true
      
      - name: Build verification
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        continue-on-error: true
      
      - name: Security audit
        id: security
        run: |
          echo "Running security audit..."
          if npm audit --audit-level high --production; then
            echo "SECURITY_STATUS=passed" >> $GITHUB_ENV
          else
            echo "SECURITY_STATUS=failed" >> $GITHUB_ENV
          fi
        continue-on-error: true
      
      - name: Determine overall status
        id: status
        run: |
          TYPECHECK_STATUS="${{ steps.typecheck.outcome }}"
          LINT_STATUS="${{ steps.lint.outcome }}"
          TESTS_STATUS="${{ steps.tests.outcome }}"
          BUILD_STATUS="${{ steps.build.outcome }}"
          
          if [[ "$TYPECHECK_STATUS" == "success" && "$LINT_STATUS" == "success" && "$TESTS_STATUS" == "success" && "$BUILD_STATUS" == "success" ]]; then
            echo "OVERALL_STATUS=success" >> $GITHUB_ENV
          else
            echo "OVERALL_STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi

  quality-assessment:
    name: Quality Assessment & Issue Creation
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    if: always()
    
    steps:
      - name: PR Quality Report
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const frontendResult = '${{ needs.frontend-quality.result }}';
            const typecheckStatus = '${{ needs.frontend-quality.outputs.typecheck }}' || 'unknown';
            const lintStatus = '${{ needs.frontend-quality.outputs.lint }}' || 'unknown';
            const testsStatus = '${{ needs.frontend-quality.outputs.tests }}' || 'unknown';
            const buildStatus = '${{ needs.frontend-quality.outputs.build }}' || 'unknown';
            const securityStatus = '${{ env.SECURITY_STATUS }}' || 'unknown';
            
            let message = '## 🔍 Frontend Quality Assessment\n\n';
            message += `**Overall Status**: ${frontendResult === 'success' ? '✅ READY' : '❌ BLOCKED'}\n\n`;
            message += '**Detailed Results:**\n';
            message += `- TypeScript: ${typecheckStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Linting: ${lintStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Tests: ${testsStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Build: ${buildStatus === 'success' ? '✅' : '❌'}\n`;
            message += `- Security: ${securityStatus === 'passed' ? '✅' : '❌'}\n\n`;
            
            if (frontendResult === 'success') {
              message += '🚀 **READY FOR DEV** - All quality gates passed. @MyatPyaePaingPie ready for your review.';
            } else {
              message += '⚠️ **BLOCKED** - Quality issues must be resolved before merging to dev.';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Create quality failure issue
        if: needs.frontend-quality.result == 'failure'
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;
            const branchName = context.payload.pull_request.head.ref;
            
            // Check for existing quality failure issues for this PR
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'quality-failure',
              state: 'open'
            });
            
            const existingIssue = existingIssues.find(issue => 
              issue.title.includes(`PR #${prNumber}`) || issue.title.includes(branchName)
            );
            
            if (existingIssue) {
              console.log(`Quality failure issue already exists: #${existingIssue.number}`);
              return;
            }
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const branchName = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;
            const prTitle = context.payload.pull_request.title;
            
            // Check which specific checks failed
            const typecheckStatus = '${{ needs.frontend-quality.outputs.typecheck }}' || 'unknown';
            const lintStatus = '${{ needs.frontend-quality.outputs.lint }}' || 'unknown';
            const testsStatus = '${{ needs.frontend-quality.outputs.tests }}' || 'unknown';
            const buildStatus = '${{ needs.frontend-quality.outputs.build }}' || 'unknown';
            
            let failedChecks = [];
            if (typecheckStatus !== 'success') failedChecks.push('TypeScript compilation');
            if (lintStatus !== 'success') failedChecks.push('Code linting');
            if (testsStatus !== 'success') failedChecks.push('Unit tests');
            if (buildStatus !== 'success') failedChecks.push('Build process');
            
            const issueBody = `## ❌ Quality Gate Failure
            
            **Pull Request**: #${prNumber} - ${prTitle}
            **Branch**: \`${branchName}\`
            **Author**: @${author}
            **Commit**: \`${commitSha}\`
            
            **Failed Checks**: ${failedChecks.join(', ')}
            
            **Actions Required:**
            ${failedChecks.map(check => `- [ ] Fix ${check} issues`).join('\n')}
            
            **Investigation Steps:**
            1. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for detailed logs
            2. Run checks locally:
               \`\`\`bash
               npm run lint          # Fix linting issues
               npx tsc --noEmit      # Check TypeScript errors
               npm test              # Run tests
               npm run build         # Test build
               \`\`\`
            3. Fix identified issues and push updates
            4. Re-run quality checks
            
            **Ownership:**
            - **Developer**: @${author} (fix issues)
            - **Review**: @MyatPyaePaingPie (after fixes completed)
            
            ---
            *Auto-generated from failed quality gate - closes automatically when issues resolved*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Quality Issues: ${branchName} (PR #${prNumber})`,
              body: issueBody,
              labels: ['quality-failure', 'needs-fix', 'automated'],
              assignees: [author]
            });

      - name: Create security issue
        if: env.SECURITY_STATUS == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const branchName = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;
            const prTitle = context.payload.pull_request.title;
            
            const issueBody = `## 🔒 Security Vulnerabilities Detected
            
            **Pull Request**: #${prNumber} - ${prTitle}
            **Branch**: \`${branchName}\`
            **Author**: @${author}
            **Commit**: \`${commitSha}\`
            
            **Security Alert**: High or critical vulnerabilities found in dependencies
            
            **Immediate Actions Required:**
            1. **Investigate**: \`npm audit --audit-level high\`
            2. **Fix automatically**: \`npm audit fix\`
            3. **Manual fixes**: \`npm audit fix --force\` (review changes carefully)
            4. **Test**: \`npm test && npm run build\`
            5. **Commit fixes**: Update package-lock.json and push
            
            **Security Commands:**
            \`\`\`bash
            # Check vulnerabilities
            npm audit --audit-level high
            
            # Auto-fix when possible
            npm audit fix
            
            # Force fix (review changes!)
            npm audit fix --force
            
            # Verify everything still works
            npm test
            npm run build
            \`\`\`
            
            **Priority**: 🔴 **HIGH** - Security vulnerabilities block production deployment
            
            **Ownership:**
            - **Fix**: @${author}
            - **Security Review**: @MyatPyaePaingPie
            
            ---
            *Auto-generated security alert - must be resolved before production*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Alert: ${branchName} (PR #${prNumber})`,
              body: issueBody,
              labels: ['security', 'vulnerability', 'urgent', 'needs-fix'],
              assignees: [author, 'MyatPyaePaingPie']
            });