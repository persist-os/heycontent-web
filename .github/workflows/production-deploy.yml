name: Production Deployment

on:
  push:
    branches: [main]

jobs:
  verify-production-deployment:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for Vercel production deployment
        run: |
          echo "Waiting for Vercel production auto-deployment to complete..."
          sleep 180  # Give Vercel 3 minutes to deploy to production
      
      - name: Health check production environment
        run: |
          echo "Checking production environment health..."
          
          # Check if the production site is accessible
          for i in {1..15}; do
            if curl -f -s https://heycontent-web-divertissement-ai.vercel.app > /dev/null; then
              echo "✅ Production site is accessible"
              break
            else
              echo "⏳ Attempt $i: Production site not ready yet, waiting..."
              sleep 30
            fi
            
            if [ $i -eq 15 ]; then
              echo "❌ Production site failed health check after 15 attempts"
              exit 1
            fi
          done
      
      - name: Production smoke tests
        run: |
          # Basic HTTP status check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://heycontent-web-divertissement-ai.vercel.app)
          
          if [ $STATUS -eq 200 ]; then
            echo "✅ Production site returns 200 OK"
          else
            echo "❌ Production site returned status: $STATUS"
            exit 1
          fi
          
          # Check if essential pages load
          echo "Checking essential pages..."
          
          # Home page
          if curl -f -s https://heycontent-web-divertissement-ai.vercel.app > /dev/null; then
            echo "✅ Homepage accessible"
          else
            echo "❌ Homepage failed"
            exit 1
          fi
          
          # Login page (might redirect, so just check it doesn't 500)
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://heycontent-web-divertissement-ai.vercel.app/sign-in)
          if [ $LOGIN_STATUS -lt 500 ]; then
            echo "✅ Login page accessible (status: $LOGIN_STATUS)"
          else
            echo "❌ Login page failed with status: $LOGIN_STATUS"
            exit 1
          fi

  production-notification:
    name: Production Success Notification
    runs-on: ubuntu-latest
    needs: [verify-production-deployment]
    
    steps:
      - name: Close production review issue
        uses: actions/github-script@v7
        with:
          script: |
            // Find and close the production review issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'production-review',
              state: 'open'
            });
            
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ **PRODUCTION DEPLOYMENT SUCCESSFUL** - This review has been completed. Production is live!'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: ['production-review', 'deployed']
              });
            }
      
      - name: Create production deployment record
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No commit message';
            
            const issueBody = `## 🚀 Production Deployment Successful
            
            **Deployment Details:**
            - **Commit**: \`${commitSha}\`
            - **Message**: ${commitMessage}
            - **Author**: ${context.payload.head_commit?.author?.name || 'Unknown'}
            - **Deployed At**: ${new Date().toISOString()}
            
            **Production URLs:**
            - 🌐 **Live Site**: https://heycontent-web-divertissement-ai.vercel.app
            - 🔗 **Main Domain**: (Add your custom domain if you have one)
            
            **Verification Status:**
            - ✅ Health checks passed
            - ✅ Essential pages accessible
            - ✅ Production environment verified
            
            **Team Notifications:**
            - @MyatPyaePaingPie ✅ Quality review completed
            - @Shreyboiii ✅ Production approval completed
            - @ariaxhan 📢 New version live
            
            ---
            *Production deployment completed successfully*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Production Deployed: ${commitSha}`,
              body: issueBody,
              labels: ['production-deployed', 'announcement']
            });
      
      - name: Production success commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            
            const commentBody = `## 🚀 PRODUCTION DEPLOYMENT SUCCESSFUL
            
            **Status**: ✅ Live in production
            **Health Check**: ✅ All systems operational
            **Production URL**: https://heycontent-web-divertissement-ai.vercel.app
            
            **Team Summary:**
            - Quality gates passed by @MyatPyaePaingPie
            - Production approved by @Shreyboiii  
            - Successfully deployed and verified
            
            **Quick Links:**
            - [🌐 Live Site](https://heycontent-web-divertissement-ai.vercel.app)
            - [🔐 Login Page](https://heycontent-web-divertissement-ai.vercel.app/sign-in)
            
            All systems operational! 🎉`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });

  rollback-preparation:
    name: Prepare Rollback Information
    runs-on: ubuntu-latest
    needs: [verify-production-deployment]
    if: failure()
    
    steps:
      - name: Create rollback issue
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const commitSha = context.sha.substring(0, 7);
            
            const rollbackBody = `## ⚠️ PRODUCTION DEPLOYMENT FAILED
            
            **Failed Deployment:**
            - **Commit**: \`${commitSha}\`
            - **Time**: ${new Date().toISOString()}
            
            **Immediate Actions Needed:**
            @MyatPyaePaingPie - Production deployment failed verification
            
            **Rollback Options:**
            1. **Revert commit**: \`git revert ${context.sha}\`
            2. **Force push previous version**: Check previous working commit
            3. **Emergency hotfix**: Create hotfix branch if needed
            
            **Investigation:**
            - Check deployment logs in Actions tab
            - Verify Vercel deployment status
            - Test production URL manually
            
            **Status Check:**
            - [ ] Production site accessibility verified
            - [ ] Error logs reviewed
            - [ ] Rollback decision made
            
            ---
            *Emergency deployment failure - immediate attention required*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 PRODUCTION DEPLOYMENT FAILED: ${commitSha}`,
              body: rollbackBody,
              labels: ['production-failed', 'urgent', 'needs-MyatPyaePaingPie-review'],
              assignees: ['MyatPyaePaingPie']
            });