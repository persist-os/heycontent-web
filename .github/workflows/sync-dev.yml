name: Sync Dev After Main Deployment

on:
  push:
    branches: [main]

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write        # Needed to push to branches
  pull-requests: write   # Needed to create PRs if needed
  issues: write          # Needed to create issues on failure

jobs:
  sync-dev-branch:
    name: Sync Dev with Main
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch full history
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Sync dev branch with main
        run: |
          echo "🔄 Syncing dev branch with main after deployment..."
          
          # Fetch all branches
          git fetch origin
          
          # Switch to dev branch
          git checkout dev
          
          # Merge main into dev to sync them
          git merge origin/main --no-ff -m "🤖 Auto-sync dev with main after production deployment"
          
          # Push the updated dev branch
          git push origin dev
          
          echo "✅ Dev branch successfully synced with main"
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Failed to sync dev branch with main',
              body: `
              ## ⚠️ Dev Branch Sync Failed
              
              The automatic sync of the dev branch with main failed after deployment.
              
              **Repository**: ${context.repo.repo}
              **Workflow Run**: [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
              **Error**: Check the workflow logs for details
              
              **Action Required**: 
              Someone needs to manually sync the dev branch with main.
              
              ### Manual Sync Commands:
              \`\`\`bash
              git checkout dev
              git pull origin dev
              git merge origin/main
              git push origin dev
              \`\`\`
              
              **Triggered by**: ${context.actor}
              **Commit**: ${context.sha.substring(0, 7)}
              `,
              labels: ['bug', 'urgent', 'automation']
            });